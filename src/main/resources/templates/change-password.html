<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - RReader</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <meta th:if="${successMessage}" http-equiv="refresh" content="2;url=/">
</head>

<body>
    <div class="login-container">
        <div class="login-form">
            <h2 class="login-title">Change Password</h2>

            <div class="alert alert-warning" role="alert">
                For security reasons, you must change your password before continuing.
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/change-password}" method="post" th:if="${successMessage == null}">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <input type="password"
                           class="form-control"
                           id="currentPassword"
                           name="currentPassword"
                           placeholder="Enter current password"
                           autocomplete="current-password"
                           required
                           autofocus>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password"
                           class="form-control"
                           id="newPassword"
                           name="newPassword"
                           placeholder="Enter new password"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm new password"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Change Password</button>
                </div>
            </form>

            <div class="mt-3 text-center">
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </div>

</body>
</html>
