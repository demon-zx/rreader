<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>RReader</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/reader.css}" rel="stylesheet">
</head>

<body>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer type="module" th:src="@{/js/reader.js}"></script>

    <div id="book" class="book" th:attr="data-id=${id},data-scope=${type}">
        <img id="view" alt="Изображение с сервера" src="" style="opacity: 1;" />
        <div id="magnifier" class="magnifier">
            <img id="magnifier-view" alt="" />
        </div>

        <div id="loader" class="loader loader-off">Загрузка...</div>
        <div id="author" class="info author">Автор</div>
        <div id="page" class="info page">0/0</div>
        <div id="title" class="info title">Название</div>
        <div id="next" class="overlay btn-next">Следующая страница</div>
        <div id="prev" class="overlay btn-prev">Предыдущая страница</div>
        <div id="menu-trigger" class="overlay menu-trigger">Меню</div>
        <div id="menu" class="menu menu-hidden">
            <div class="menu-item" onclick="window.location.href='/'">Библиотека</div>
            <div id="menu-settings" class="menu-item">Настройки</div>
            <div id="menu-width-100" class="menu-item" data-width="100">Ширина 100%</div>
            <div id="menu-width-50" class="menu-item" data-width="50">Ширина 50%</div>
            <div id="menu-magnifier" class="menu-item">Чтение с лупой</div>
        </div>
    </div>

</body>

</html>
