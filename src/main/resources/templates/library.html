<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>RReader</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/library.css}" rel="stylesheet">
</head>

<body>
<script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script defer type="module" th:src="@{/js/library.js}"></script>

<div class="container">
    <div class="row">
        <div class="col-12 mb-1 d-flex justify-content-between align-items-center">
            <h1>Remote Reader</h1>
            <a th:href="@{/settings}" class="btn btn-outline-secondary" title="Settings">⚙️</a>
        </div>
    </div>
    <div id="recent" style="display: none">
        <div class="row">
            <div class="col-12">
                <h5>Currently reading</h5>
            </div>
        </div>
        <div class="row" id="recent-books">
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <h5>Library</h5>
        </div>
    </div>
    <div class="row">
        <div class="col-12 mb-1">
            <form>
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon1">🔎</span>
                    <input id="search" type="text" class="form-control" placeholder="Search..."/>
                    <button class="btn btn-outline-secondary" type="button" id="search-clear">✖️</button>
                </div>
            </form>
        </div>
    </div>
    <nav class="pager row mb-1" aria-label="Навигация по страницам" style="display: none">
        <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <small class="pager-info text-body-secondary"></small>
            <ul class="pager-pages pagination pagination-sm mb-0"></ul>
        </div>
    </nav>
    <div class="row" id="books">
        <!-- example -->
        <div class="col-12 col-lg-6">
            <div class="card mb-1">
                <div class="row g-0">
                    <div class="col-auto">
                        <img src="" class="book-cover" alt="Cover">
                    </div>
                    <div class="col">
                        <div class="card-body">
                            <h5 class="card-title book-author">Author</h5>
                            <p class="card-text book-title">Book title</p>
                            <h6>Размер: <span class="badge text-bg-secondary">2 MB</span></h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <nav class="pager row mb-1" aria-label="Навигация по страницам" style="display: none">
        <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <small class="pager-info text-body-secondary"></small>
            <ul class="pager-pages pagination pagination-sm mb-0"></ul>
        </div>
    </nav>
</div>

</body>
</html>
