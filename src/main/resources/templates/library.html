<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RReader</title>
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/library.css}" rel="stylesheet">
</head>

<body>
<script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script defer type="module" th:src="@{/js/library.js}"></script>

<div class="container">
    <div class="row">
        <div class="col-12 mb-1">
            <h1>Library</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-12 mb-1">
            <form>
                <div class="input-group">
                    <span class="input-group-text" id="basic-addon1">🔎</span>
                    <input id="search" type="text" class="form-control" placeholder="Search..."/>
                    <button class="btn btn-outline-secondary" type="button" id="search-clear">✖️</button>
                </div>
            </form>
        </div>
    </div>
    <div class="row" id="books">
        <!-- example -->
        <div class="col-12 col-lg-6">
            <div class="card mb-1">
                <div class="row g-0">
                    <div class="col-auto">
                        <img src="https://ir.ozone.ru/s3/multimedia-1-r/8323763463.jpg" class="book-cover"
                             alt="...">
                    </div>
                    <div class="col">
                        <div class="card-body">
                            <h5 class="card-title book-author">Author</h5>
                            <p class="card-text book-title">Book title</p>
                            <h6>Размер: <span class="badge text-bg-secondary">2 MB</span></h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="row" id="pager">
        <div class="col-12">
<!--            Not implemented-->
        </div>
    </div>
</div>

</body>
</html>
