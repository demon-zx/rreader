<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RReader</title>
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <style>
        .book-author {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-cover {
            width: 100px;
            min-width: 100px;
            max-width: 100px;
            height: 135px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #e9ecef;
            display: block;
        }

        @media (max-width: 576px) {
            .book-cover {
                width: 80px;
                min-width: 80px;
                max-width: 80px;
                height: 108px;
            }
        }

    </style>
</head>

<body>

<script type="module" th:src="@{/js/library.js}"></script>

<div class="container">
    <div class="row">
        <div class="col-12 mb-1">
            <h1>Library</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-12 mb-1">
            <form>
                <input id="search" class="form-control" placeholder="Search... (Not implemented)"/>
            </form>
        </div>
    </div>
    <div class="row" id="books">
        <!-- example -->
        <div class="col-12 col-lg-6">
            <div class="card mb-1">
                <div class="row g-0">
                    <div class="col-auto">
                        <img src="https://ir.ozone.ru/s3/multimedia-1-r/8323763463.jpg" class="book-cover"
                             alt="...">
                    </div>
                    <div class="col">
                        <div class="card-body">
                            <h5 class="card-title book-author">Author</h5>
                            <p class="card-text book-title">Book title</p>
                            <h6>Размер: <span class="badge text-bg-secondary">2 MB</span></h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="row" id="pager">
        <div class="col-12">
<!--            Not implemented-->
        </div>
    </div>
</div>

</body>
</html>
