
# Значения отмеченные как '<empty>' необходимо заполнить в файле наследнике свойств
application:
    name: rreader
    version: 1.0
    zone-id: Europe/Moscow
    path:
        books: ./books
        config: ./config

management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web:
            exposure:
                include: health,metrics,loggers

spring:
    application:
        name: ${application.name}
    datasource:
        url: jdbc:h2:${application.path.config}/library
        username: reader
        password: reader
        driver-class-name: org.h2.Driver
        validation-query: select now()
        validation-query-timeout: 5
        max-idle: 2
        max-total: 5
        max-wait-millis: 20000

springdoc:
    swagger-ui:
        path: /api/v1/swagger-ui
    api-docs:
        path: /api-docs

server:
    error:
        include-message: ALWAYS
    tomcat:
        mbeanregistry:
            enabled: true
